apiVersion: v1
kind: Pod
metadata: {name: policy-admission-check, namespace: policy-lab}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: demo
      image: busybox:1.36
      command: ["sleep","5"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
