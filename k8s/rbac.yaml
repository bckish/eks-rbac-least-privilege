apiVersion: v1
kind: Namespace
metadata: { name: application }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: deployer, namespace: application }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: deployer, namespace: application }
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: deployer, namespace: application }
subjects: [{ kind: ServiceAccount, name: deployer, namespace: application }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployer }
